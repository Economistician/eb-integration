# Electric Barometer — Canonical Workflows
#
# This file defines hand-authored “golden paths” for composing EB functionality.
# Workflows must reference public APIs only (i.e., symbols that are exported and
# should appear in llm/api_index.json).
#
# Keep workflows stable and versioned (e.g., *_v1, *_v2). Prefer additive changes.

schema_version: "1.0"

workflows:
  - id: validation_v1
    title: "Validate EB contract artifacts"
    intent: >
      Validate EB contract-conformant artifacts using canonical eb_contracts
      validation entrypoints. This workflow is the required first step before
      downstream evaluation, governance, or optimization.

    applicability:
      artifacts:
        - panel_point_v1

    inputs:
      - name: artifact
        description: "A Python object intended to conform to an EB contract."
      - name: artifact_kind
        description: >
          The intended contract validator to apply. Must be one of:
          - panel_point_v1

    outputs:
      - name: validated_artifact
        description: >
          The validated artifact (may be returned unchanged). If invalid, the
          validator raises an exception.

    steps:
      - id: choose_validator
        description: >
          Select the correct validation function based on artifact_kind.
        selection:
          by: artifact_kind
          cases:
            panel_point_v1:
              import: "from eb_contracts.api.validate import panel_point_v1"
              call: "panel_point_v1(artifact)"

    notes:
      - "Validation must not be skipped for convenience."
      - >
        Do not infer aliases or semantic equivalences between validators or contracts.
        If a relationship (e.g., aliasing, replacement, or shared contract semantics)
        is not explicitly documented in EB sources, treat it as unknown.
      - >
        This workflow references only APIs present in llm/api_index.json.
        If additional validators become public (added to __all__ and indexed),
        add them as new cases here.

  - id: governance_workflow_v1
    title: "Run governance workflow on DataFrame inputs"
    intent: >
      Execute the canonical governance workflow over DataFrame inputs using the
      public eb_evaluation dataframe governance entrypoints. This workflow should
      be used when the goal is to produce governance-ready outputs (and any
      intermediate evaluation artifacts) rather than assembling ad-hoc pipelines.

    applicability:
      interfaces:
        - dataframe
      variants:
        - name: workflow_df
          description: "Single-call governance workflow (DataFrame in, DataFrame out)."
        - name: workflow_df_dict
          description: "Single-call governance workflow returning structured outputs as a dict."
        - name: governance_panel_df
          description: "Evaluate governance panel over a DataFrame input."

    inputs:
      - name: df
        description: "Input DataFrame for governance evaluation/workflow."
      - name: config
        description: >
          Workflow configuration object(s) required by the selected entrypoint
          (policy/threshold/cost parameters, etc.). The exact schema must be taken
          from the function signature and docstring in llm/api_index.json.

    outputs:
      - name: result
        description: >
          Governance outputs produced by the selected entrypoint. Concrete output
          shapes vary by variant; do not assume return types beyond what is
          documented by the indexed function(s).

    steps:
      - id: select_entrypoint
        description: >
          Select the correct governance entrypoint based on the desired variant.
        selection:
          by: variant
          cases:
            workflow_df:
              import: "from eb_evaluation.dataframe.governance_workflow import run_governance_workflow_df"
              call: "run_governance_workflow_df(df=df, **config)"
              output: "result"
            workflow_df_dict:
              import: "from eb_evaluation.dataframe.governance_workflow import run_governance_workflow_df_dict"
              call: "run_governance_workflow_df_dict(df=df, **config)"
              output: "result"
            governance_panel_df:
              import: "from eb_evaluation.dataframe.governance_panel import evaluate_governance_panel_df"
              call: "evaluate_governance_panel_df(df=df, **config)"
              output: "result"

      - id: confirm_signature_from_index
        description: >
          Before proposing concrete argument names, defaults, return types, or
          column requirements, the LLM must quote the exact `signature` field
          from the corresponding llm/api_index.json entry for the selected
          entrypoint. If the signature is missing or ambiguous, the LLM must
          request clarification rather than inventing arguments or return shapes.
        requirement:
          must_echo_index_signature: true
          must_not_invent_defaults: true
          return_types:
            may_echo_from_signature_only: true
            must_not_restate_as_guarantee: true

    notes:
      - >
        This workflow is DataFrame-oriented. If your artifact is a contract object,
        validate it first (validation_v1) and then convert/prepare the required
        DataFrame inputs expected by the selected governance entrypoint.
      - >
        Do not invent column requirements or configuration schemas. Use the indexed
        function signature and doc_summary from llm/api_index.json to determine
        required arguments and expected inputs/outputs.
      - >
        Do not infer aliases or semantic equivalences between entrypoints. Treat
        each indexed function as distinct unless EB sources explicitly state otherwise.

  # ---------------------------------------------------------------------------
  # Future workflows (add when the corresponding public APIs exist and are indexed)
  # ---------------------------------------------------------------------------
  # - id: panel_evaluation_v1
  # - id: apply_ral_v1
