######################################
# Build system
######################################
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

######################################
# Setuptools configuration
######################################
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
exclude = [
  "llm*",
  "tooling*",
  "tests*",
]

######################################
# Project metadata
######################################
[project]
name = "eb-integration"
version = "0.1.3"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
]

######################################
# Runtime dependencies
######################################
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

######################################
# Development dependencies
######################################
[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "pytest-cov",
]

dev = [
  "ruff>=0.1.0",
  "pyright>=1.1",
  "twine>=4.0",
  "build",
  "pytest>=7.0",
  "pytest-cov",
]

# Opt-in: install EB packages to run @pytest.mark.ecosystem tests.
ecosystem = [
  "eb-contracts==0.2.2",
  "eb-evaluation==0.2.9",
  "eb-metrics==0.2.8",
  "electric-barometer==0.2.9",
]

######################################
# Pytest configuration
######################################
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "smoke: fast infrastructure smoke tests (numpy/pandas + minimal invariants)",
  "ecosystem: cross-package integration smoke tests (run when EB packages are installed)",
]
