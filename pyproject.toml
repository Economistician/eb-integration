######################################
# Project metadata
######################################
[project]
name = "eb-integration"
version = "0.1.0"
requires-python = ">=3.13"

######################################
# Runtime dependencies
######################################
dependencies = [
  "pytest",
  "numpy>=1.24",
  "pandas>=2.0",
]

######################################
# Pytest configuration
######################################
[tool.pytest.ini_options]
testpaths = ["tests"]