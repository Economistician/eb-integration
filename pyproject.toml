######################################
# Project metadata
######################################
[project]
name = "eb-integration"
version = "0.1.3"
requires-python = ">=3.11"

######################################
# Runtime dependencies
######################################
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

######################################
# Development dependencies
######################################
[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "pytest-cov",
]

dev = [
  "ruff>=0.1.0",
  "pyright>=1.1",
  "twine>=4.0",
  "build",
  "pytest>=7.0",
  "pytest-cov",
]

# Opt-in: install EB packages to run @pytest.mark.ecosystem tests.
ecosystem = [
  "eb-contracts>=0.2,<0.3",
  "eb-evaluation>=0.2,<0.3",
  "eb-metrics>=0.2,<0.3",
  "electric-barometer>=0.2,<0.3",
]

######################################
# Pytest configuration
######################################
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "smoke: fast infrastructure smoke tests (numpy/pandas + minimal invariants)",
  "ecosystem: cross-package integration smoke tests (run when EB packages are installed)",
]
