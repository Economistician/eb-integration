######################################
# Project metadata
######################################
[project]
name = "eb-integration"
version = "0.1.1"
requires-python = ">=3.11"

######################################
# Runtime dependencies
######################################
dependencies = [
  "pytest",
  "numpy>=1.24",
  "pandas>=2.0",
]

######################################
# Development dependencies
######################################
[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov",
]
dev = [
    "ruff>=0.1.0",
    "pyright>=1.1",
    "twine>=4.0",
    "build",
]

######################################
# Pytest configuration
######################################
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]