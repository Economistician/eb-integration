name: Gate - Dependency Audit

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use for the audit'
        required: true
        type: string
      extras:
        description: 'Extras to install for auditing'
        required: false
        default: ".[test]"
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ${{ inputs.extras }} pip-audit

      - name: Run Audit
        run: pip-audit
