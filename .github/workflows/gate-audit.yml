name: Gate - Dependency Audit

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use for the audit"
        required: true
        type: string
      extras:
        description: "Extras to install for auditing"
        required: false
        default: "test"
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          EXTRAS="${{ inputs.extras }}"
          if [ -n "$EXTRAS" ]; then
            EXTRAS="${EXTRAS#.[}"
            EXTRAS="${EXTRAS#[}"
            EXTRAS="${EXTRAS%]}"
            attempt=1
            max_attempts=8
            delay=5
            until python -m pip install ".[${EXTRAS}]"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "ERROR: pip install .[${EXTRAS}] failed after ${max_attempts} attempts."
                echo "If this is a coordinated system release, wait until exact pins exist on PyPI and re-run CI."
                exit 1
              fi
              echo "pip install failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
              if [ "$delay" -gt 40 ]; then
                delay=40
              fi
            done
          fi

          python -m pip install -U pip-audit

      - name: Run Audit
        run: pip-audit
