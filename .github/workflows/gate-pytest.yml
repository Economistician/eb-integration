name: Gate - Pytest

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python-version:
        required: true
        type: string
      extras:
        required: true
        type: string

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install -U pip setuptools wheel

      - name: Install package (editable) with extras
        shell: bash
        run: |
          EXTRAS="${{ inputs.extras }}"
          if [ -n "$EXTRAS" ]; then
            EXTRAS="${EXTRAS#.[}"
            EXTRAS="${EXTRAS#[}"
            EXTRAS="${EXTRAS%]}"
            python -m pip install -e ".[${EXTRAS}]"
          else
            python -m pip install -e .
          fi

      - name: Run unit tests
        run: python -m pytest -q
