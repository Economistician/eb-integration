name: Gate - Pre-commit

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      # 1. Fetch the Hub's tooling if we are running in a Leaf repo
      - name: Checkout eb-integration (tooling)
        if: ${{ github.repository != 'Economistician/eb-integration' }}
        uses: actions/checkout@v4
        with:
          repository: Economistician/eb-integration
          path: .eb-integration
          sparse-checkout: |
            tooling/
          fetch-depth: 1

      # 2. Sync the tooling folder to the root
      - name: Sync Tooling
        if: ${{ github.repository != 'Economistician/eb-integration' }}
        shell: bash
        run: |
          rm -rf tooling
          cp -r .eb-integration/tooling ./tooling

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install -U pip
          python -m pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          # Now reliably points to the synced tooling folder
          key: pre-commit-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('tooling/.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ inputs.python-version }}-

      - name: Run pre-commit
        # Standardized path for all repositories
        run: pre-commit run --all-files --show-diff-on-failure --config tooling/.pre-commit-config.yaml
