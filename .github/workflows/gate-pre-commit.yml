name: Gate - Pre-commit

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install -U pip
          python -m pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          # Updated hashFiles to point to the file in the tooling folder
          key: pre-commit-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('tooling/.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ inputs.python-version }}-

      - name: Run pre-commit
        # Added the --config flag to tell pre-commit exactly where the file is
        run: pre-commit run --all-files --show-diff-on-failure --config tooling/.pre-commit-config.yaml