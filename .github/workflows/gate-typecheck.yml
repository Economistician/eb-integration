name: Gate - Typecheck

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      tool:
        required: true
        type: string
      extras:
        required: false
        default: "test"
        type: string

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      # 1. Fetch the Hub's tooling for Leaf repos
      - name: Checkout eb-integration (tooling)
        if: ${{ github.repository != 'Economistician/eb-integration' }}
        uses: actions/checkout@v4
        with:
          repository: Economistician/eb-integration
          path: .eb-integration
          sparse-checkout: |
            tooling/
          fetch-depth: 1

      # 2. Sync the tooling folder
      - name: Sync Tooling
        if: ${{ github.repository != 'Economistician/eb-integration' }}
        shell: bash
        run: |
          rm -rf tooling
          cp -r .eb-integration/tooling ./tooling

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      # 3. Clean stale build artifacts and install dependencies
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -U pip
          rm -rf build/ dist/ *.egg-info

          EXTRAS="${{ inputs.extras }}"
          if [ -n "$EXTRAS" ]; then
            EXTRAS="${EXTRAS#.[}"
            EXTRAS="${EXTRAS#[}"
            EXTRAS="${EXTRAS%]}"
            python -m pip install ".[${EXTRAS}]"
          else
            python -m pip install .
          fi

      - name: Install typechecker
        shell: bash
        run: |
          if [ "${{ inputs.tool }}" = "pyright" ]; then
            python -m pip install -U pyright
          elif [ "${{ inputs.tool }}" = "mypy" ]; then
            python -m pip install -U mypy
          else
            echo "Unknown tool: ${{ inputs.tool }}"
            exit 1
          fi

      - name: Run typecheck
        shell: bash
        run: |
          if [ "${{ inputs.tool }}" = "pyright" ]; then
            pyright --project tooling/pyrightconfig.json src/
          else
            mypy src/
          fi
