name: Gate - Typecheck

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      tool:
        required: true
        type: string

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install typechecker
        run: |
          python -m pip install -U pip
          if [ "${{ inputs.tool }}" = "pyright" ]; then
            python -m pip install -U pyright
          elif [ "${{ inputs.tool }}" = "mypy" ]; then
            python -m pip install -U mypy
          else
            echo "Unknown tool: ${{ inputs.tool }}"
            exit 1
          fi

      - name: Run typecheck
        run: |
          if [ "${{ inputs.tool }}" = "pyright" ]; then
            pyright --project tooling/pyrightconfig.json
          else
            mypy .
          fi