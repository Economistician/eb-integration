name: Gate - Package

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install build + twine
        run: python -m pip install -U pip build twine

      - name: Check for Version Conflict
        shell: bash
        run: |
          # 1. Get current version from build metadata
          # We use --version to extract it directly from your project
          CURRENT_VERSION=$(python -m pip install . --dry-run | grep -oP '(?<=Successfully installed ).*' || python -c "import pathlib, re; p = pathlib.Path('pyproject.toml').read_text(); print(re.search(r'version\s*=\s*\"(.+?)\"', p).group(1))")
          echo "Current local version: $CURRENT_VERSION"
          
          # 2. Extract package name from pyproject.toml
          PACKAGE_NAME=$(python -c "import pathlib, re; p = pathlib.Path('pyproject.toml').read_text(); print(re.search(r'name\s*=\s*\"(.+?)\"', p).group(1))")
          
          # 3. Check PyPI for this specific version
          # If pip index finds it, the version is already taken
          if pip index versions $PACKAGE_NAME | grep -q "($CURRENT_VERSION)"; then
            echo "ERROR: Version $CURRENT_VERSION of $PACKAGE_NAME already exists on PyPI."
            echo "Please bump the version in pyproject.toml before pushing."
            exit 1
          else
            echo "SUCCESS: Version $CURRENT_VERSION is available."
          fi

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel

      - name: Twine check
        run: python -m twine check dist/*