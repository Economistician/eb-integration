name: Gate - Package

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install build + twine
        run: python -m pip install -U pip build twine

      - name: Inspect published PyPI version
        shell: bash
        run: |
          CURRENT_VERSION=$(python -c "import pathlib, re; p = pathlib.Path('pyproject.toml').read_text(); print(re.search(r'version\s*=\s*\"(.+?)\"', p).group(1))")
          PACKAGE_NAME=$(python -c "import pathlib, re; p = pathlib.Path('pyproject.toml').read_text(); print(re.search(r'name\s*=\s*\"(.+?)\"', p).group(1))")
          echo "Current local version: $CURRENT_VERSION"

          if pip index versions "$PACKAGE_NAME" | grep -q "($CURRENT_VERSION)"; then
            echo "NOTICE: Version $CURRENT_VERSION of $PACKAGE_NAME is already on PyPI."
            echo "This is expected on post-release PRs and pushes. Bump the version before publishing."
          else
            echo "SUCCESS: Version $CURRENT_VERSION is not yet published."
          fi

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel

      - name: Twine check
        run: python -m twine check dist/*
