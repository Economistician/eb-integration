name: PyPI Smoke Test

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version used for smoke test"
        required: false
        default: "3.12"
        type: string
      package:
        description: "PyPI package name to install (e.g., eb-metrics)"
        required: true
        type: string
      import_module:
        description: "Module to import (e.g., eb_metrics)"
        required: true
        type: string
      index-url:
        description: "Index URL to install from"
        required: false
        default: "https://pypi.org/simple"
        type: string
      extra_smoke_command:
        description: "Optional extra smoke command(s) to run after import"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install from index (with retries)
        run: |
          # PyPI mirrors can take 1-2 minutes to sync after a release.
          # We retry 5 times with a 30s sleep to avoid false negatives.
          SUCCESS=false
          for i in {1..5}; do
            echo "Attempt $i: Installing ${{ inputs.package }} from ${{ inputs.index-url }}..."
            if python -m pip install -U --no-cache-dir -i "${{ inputs.index-url }}" "${{ inputs.package }}"; then
              SUCCESS=true
              break
            fi
            echo "Package not found or install failed. Waiting 30s..."
            sleep 30
          done

          if [ "$SUCCESS" = false ]; then
            echo "Failed to install package after 5 attempts."
            exit 1
          fi

      - name: Run pip check
        run: python -m pip check

      - name: Import smoke
        run: |
          # Use -c to run the import in a clean sub-process
          python -c "import ${{ inputs.import_module }}; print('✅ ${{ inputs.package }} import successful')"

      - name: Optional extra smoke
        if: ${{ inputs.extra_smoke_command != '' }}
        run: ${{ inputs.extra_smoke_command }}
