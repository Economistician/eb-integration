name: ecosystem-smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  ecosystem-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install eb-integration + ecosystem deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install eb-contracts eb-metrics eb-evaluation

      - name: Run tests
        run: |
          pytest -q
