name: Gate - Docs

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      extras:
        required: true
        type: string
      docs_command:
        required: true
        type: string

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install -U pip setuptools wheel

      - name: Install package (editable) with extras
        run: python -m pip install -e "${{ inputs.extras }}"

      - name: Build docs
        run: ${{ inputs.docs_command }}
