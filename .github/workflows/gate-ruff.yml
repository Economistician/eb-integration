name: Gate - Ruff

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to run Ruff with"
        required: false
        type: string
        default: "3.13"

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      # Only needed when the caller is NOT eb-integration itself.
      - name: Checkout eb-integration (tooling)
        if: ${{ github.repository != 'Economistician/eb-integration' }}
        uses: actions/checkout@v4
        with:
          repository: Economistician/eb-integration
          path: .eb-integration
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install Ruff
        run: python -m pip install -U pip ruff

      - name: Ruff format (check)
        run: >
          ruff format --check
          --config ${{ github.repository == 'Economistician/eb-integration' && 'tooling/ruff.toml' || '.eb-integration/tooling/ruff.toml' }}
          --exclude .eb-integration .

      - name: Ruff lint
        run: >
          ruff check
          --config ${{ github.repository == 'Economistician/eb-integration' && 'tooling/ruff.toml' || '.eb-integration/tooling/ruff.toml' }}
          --exclude .eb-integration .
