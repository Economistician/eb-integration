name: Gate - Ruff

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to run Ruff with"
        required: false
        type: string
        default: "3.13"

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      # 1. Fetch the Hub's tooling if we are running in a Leaf repo
      - name: Checkout eb-integration (tooling)
        if: ${{ github.repository != 'Economistician/eb-integration' }}
        uses: actions/checkout@v4
        with:
          repository: Economistician/eb-integration
          path: .eb-integration
          sparse-checkout: |
            tooling/
          fetch-depth: 1

      # 2. Sync the tooling folder so the path "tooling/ruff.toml" works everywhere
      - name: Sync Tooling
        if: ${{ github.repository != 'Economistician/eb-integration' }}
        shell: bash
        run: |
          # Remove any existing symlink/folder and replace with the Hub version
          rm -rf tooling
          cp -r .eb-integration/tooling ./tooling

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install Ruff
        run: python -m pip install -U pip ruff

      # 3. Standardized commands: path is always 'tooling/ruff.toml'
      - name: Ruff format (check)
        run: ruff format --check --config tooling/ruff.toml .

      - name: Ruff lint
        run: ruff check --config tooling/ruff.toml .
