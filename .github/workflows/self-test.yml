name: Self Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # This tells the Hub to run its own PR Gate logic on itself
  call-pr-gate:
    uses: ./.github/workflows/pr-gate.yml
    with:
      import_module: "os"
      tooling_python_version: "3.13"
      extras: ".[test]"
