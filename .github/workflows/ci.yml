name: Integration CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout eb-integration
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade packaging tools
        run: python -m pip install -U pip setuptools wheel

      - name: Checkout eb-metrics
        uses: actions/checkout@v4
        with:
          repository: Economistician/eb-metrics
          path: eb-metrics

      - name: Checkout eb-evaluation
        uses: actions/checkout@v4
        with:
          repository: Economistician/eb-evaluation
          path: eb-evaluation

      - name: Install integration deps + ecosystem
        run: |
          python -m pip install -e .
          python -m pip install -e .\eb-metrics
          python -m pip install -e .\eb-evaluation

      - name: Run integration smoke tests
        run: python -m pytest -q tests